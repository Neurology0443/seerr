---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: true
        default: seerr-multi
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push Multi-Arch Image
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate image tag
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $IMAGE_TAG"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: metadata
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$SOURCE_DATE_EPOCH" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.source_date_epoch }}
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ inputs.tag }}
            ${{ steps.metadata.outputs.image }}:sha-${{ steps.metadata.outputs.short_sha }}
          cache-from: type=gha,scope=seerr-multi-docker
          cache-to: type=gha,mode=max,scope=seerr-multi-docker
          provenance: false
